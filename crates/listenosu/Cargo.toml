[package]
name = "listenosu"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
eframe = { version = "0.37.0", default-features = false, features = ["accesskit", "clipboard", "default_fonts", "glow", "links", "system_fonts", "wayland", "web_screen_reader", "x11"] }
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg"] }
library = { version = "0.1.0", path = "../library" }
platform = { version = "0.1.0", path = "../platform" }
player = { version = "0.1.0", path = "../player" }
raw-window-handle = "0.6"
rfd = "0.17"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1"
ui = { version = "0.1.0", path = "../ui" }
ureq = "3"

[target."cfg(windows)".build-dependencies]
winresource = "0.1.34"
