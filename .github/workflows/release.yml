name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v2
      - name: Package
        shell: pwsh
        run: scripts/package-windows.ps1 -Version ('${{ github.ref_name }}'.TrimStart('v'))
      - name: Publish the release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create '${{ github.ref_name }}' (Get-ChildItem dist/*.zip) --title '${{ github.ref_name }}' --generate-notes --prerelease
