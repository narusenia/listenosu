name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v2
      - name: Package
        shell: pwsh
        run: scripts/package-windows.ps1 -Version ('${{ github.ref_name }}'.TrimStart('v'))
      - name: Publish the release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = '${{ github.ref_name }}'
          $zip = Get-ChildItem dist/*.zip
          # Notes written by hand live in docs/release-notes; without them, generate from the commits.
          $notes = "docs/release-notes/$tag.md"
          if (Test-Path $notes) {
            gh release create $tag $zip --title $tag --notes-file $notes
          } else {
            gh release create $tag $zip --title $tag --generate-notes
          }
